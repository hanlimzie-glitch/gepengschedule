<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBB6D5"/>
      <stop offset="55%" stop-color="#E9B8EE"/>
      <stop offset="100%" stop-color="#C9B3F5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#bg)"/>
  <rect x="40" y="40" width="432" height="200" rx="104" fill="url(#shine)"/>

  <!-- decorative sparkles / dots -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M150 190 l10 -26 l10 26 l26 10 l-26 10 l-10 26 l-10 -26 l-26 -10 z"/>
    <path d="M405 355 l7 -18 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 z" opacity="0.9"/>
    <circle cx="380" cy="205" r="5" opacity="0.8"/>
    <circle cx="140" cy="360" r="6" opacity="0.75"/>
    <circle cx="175" cy="395" r="3.5" opacity="0.7"/>
  </g>

  <!-- bunny + chat bubble group -->
  <g fill="#ffffff" filter="url(#soft)">
    <!-- left ear -->
    <path d="M223 168
             c-6 -34 6 -60 24 -60
             c16 0 24 22 22 52
             c-1 18 -6 34 -14 46
             z"/>
    <!-- right ear -->
    <path d="M289 168
             c6 -34 -6 -60 -24 -60
             c-16 0 -24 22 -22 52
             c1 18 6 34 14 46
             z"/>
    <!-- ear inner (pink hint via low-opacity overlay applied after) -->
  </g>
  <g opacity="0.35" fill="#F48FBE">
    <path d="M238 155 c-3 -20 3 -34 12 -34 c8 0 12 12 11 28 c-1 10 -4 20 -8 26 z"/>
    <path d="M274 155 c3 -20 -3 -34 -12 -34 c-8 0 -12 12 -11 28 c1 10 4 20 8 26 z"/>
  </g>

  <!-- chat bubble / tv body -->
  <g fill="#ffffff">
    <path d="M170 210
             h172
             c22 0 40 18 40 40
             v98
             c0 22 -18 40 -40 40
             h-52
             l-30 34
             c-4 4 -12 2 -12 -6
             v-28
             h-78
             c-22 0 -40 -18 -40 -40
             v-98
             c0 -22 18 -40 40 -40 z"/>
  </g>

  <!-- inner screen cut -->
  <path d="M188 232
           h136
           c14 0 24 10 24 24
           v88
           c0 14 -10 24 -24 24
           h-136
           c-14 0 -24 -10 -24 -24
           v-88
           c0 -14 10 -24 24 -24 z"
        fill="url(#bg)" opacity="0.28"/>

  <!-- big sparkle in screen -->
  <path d="M240 300 l14 -34 l14 34 l34 14 l-34 14 l-14 34 l-14 -34 l-34 -14 z" fill="#ffffff"/>

  <!-- 3 side dots (right of bubble) -->
  <g fill="#ffffff">
    <circle cx="360" cy="270" r="7"/>
    <circle cx="360" cy="300" r="7"/>
    <circle cx="360" cy="330" r="7"/>
  </g>
</svg>
